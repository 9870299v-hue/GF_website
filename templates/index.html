<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ data.title }}</title>
    <style>
        body {
            background: linear-gradient(135deg, #FFE4E6 0%, #FECDD3 100%);
            color: #4C0519;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Floating Hearts Layer */
        .hearts-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            color: rgba(225, 29, 72, 0.4);
            font-size: 20px;
            animation: float 6s ease-in-out infinite;
            bottom: -30px;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        .h1 { left: 10%; animation-duration: 7s; animation-delay: 0s; }
        .h2 { left: 25%; animation-duration: 5s; animation-delay: 1.5s; font-size: 26px; }
        .h3 { left: 45%; animation-duration: 8s; animation-delay: 0.5s; }
        .h4 { left: 65%; animation-duration: 6s; animation-delay: 2s; font-size: 24px; }
        .h5 { left: 80%; animation-duration: 7.5s; animation-delay: 1s; }
        .h6 { left: 92%; animation-duration: 5.5s; animation-delay: 2.5s; }

        /* Main Letter Card */
        .main-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            z-index: 10;
            backdrop-filter: blur(5px);
        }

        h1 {
            color: #E11D48;
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #9F1239;
            font-size: 0.95rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .intro-text {
            font-size: 1rem;
            color: #881337;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .card-section {
            background: #FFF1F2;
            border-left: 4px solid #FB7185;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            text-align: left;
        }

        .card-section h3 {
            margin: 0 0 8px 0;
            color: #9F1239;
            font-size: 1.1rem;
        }

        .card-section p {
            margin: 0;
            color: #4C0519;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* Polaroids Desktop */
        .polaroid {
            position: absolute;
            background: white;
            padding: 12px 12px 30px 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
            border-radius: 6px;
            z-index: 5;
        }

        .polaroid img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
        }

        .p1 { top: 5%; left: 3%; transform: rotate(-8deg); }
        .p2 { top: 12%; right: 3%; transform: rotate(6deg); }
        .p3 { bottom: 5%; left: 4%; transform: rotate(5deg); }

        /* Gallery for Mobile */
        .mobile-gallery {
            display: none;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .mobile-polaroid {
            background: white;
            padding: 8px 8px 22px 8px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.12);
            border-radius: 4px;
            display: inline-block;
        }

        .mobile-polaroid img {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 2px;
        }

        .mp1 { transform: rotate(-3deg); }
        .mp2 { transform: rotate(3deg); }
        .mp3 { transform: rotate(-2deg); }

        /* Mobile Adjustments */
        @media (max-width: 1024px) {
            .polaroid { display: none; } /* Hide floating side images on small screens */
            .mobile-gallery { display: flex; } /* Show stacked gallery inside card on mobile */
            body { padding: 20px 10px; }
            .main-card { padding: 20px 15px; }
        }
    </style>
</head>
<body>

    <!-- Floating Hearts -->
    <div class="hearts-layer">
        <div class="heart h1">♥</div>
        <div class="heart h2">💖</div>
        <div class="heart h3">♥</div>
        <div class="heart h4">💕</div>
        <div class="heart h5">♥</div>
        <div class="heart h6">💗</div>
    </div>

    <!-- Polaroid Photos (Desktop Side View) -->
    <div class="polaroid p1">
        <img src="{{ url_for('static', filename='photo1.jpg') }}" alt="Photo 1">
    </div>
    <div class="polaroid p2">
        <img src="{{ url_for('static', filename='photo2.jpg') }}" alt="Photo 2">
    </div>
    <div class="polaroid p3">
        <img src="{{ url_for('static', filename='photo3.jpg') }}" alt="Photo 3">
    </div>

    <!-- Main Letter Card -->
    <div class="main-card">
        <h1>{{ data.title }}</h1>
        <div class="subtitle">{{ data.subtitle }}</div>
        <p class="intro-text">{{ data.intro }}</p>

        <!-- Polaroid Photos (Mobile Inline View) -->
        <div class="mobile-gallery">
            <div class="mobile-polaroid mp1">
                <img src="{{ url_for('static', filename='photo1.jpg') }}" alt="Photo 1">
            </div>
            <div class="mobile-polaroid mp2">
                <img src="{{ url_for('static', filename='photo2.jpg') }}" alt="Photo 2">
            </div>
            <div class="mobile-polaroid mp3">
                <img src="{{ url_for('static', filename='photo3.jpg') }}" alt="Photo 3">
            </div>
        </div>

        {% for card in data.cards %}
        <div class="card-section">
            <h3>{{ card.title }}</h3>
            <p>{{ card.text }}</p>
        </div>
        {% endfor %}
    </div>

</body>
</html>
