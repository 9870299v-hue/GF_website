
       
     <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ data.title }}</title>
    <style>
        body {
            background: linear-gradient(135deg, #FFE4E6 0%, #FECDD3 100%);
            color: #4C0519;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            z-index: 10;
        }

        h1 {
            color: #E11D48;
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #9F1239;
            font-size: 0.95rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .intro-text {
            font-size: 1rem;
            color: #881337;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .card-section {
            background: #FFF1F2;
            border-left: 4px solid #FB7185;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            text-align: left;
        }

        .card-section h3 {
            margin: 0 0 8px 0;
            color: #9F1239;
            font-size: 1.1rem;
        }

        .card-section p {
            margin: 0;
            color: #4C0519;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* Polaroids */
        .polaroid {
            position: absolute;
            background: white;
            padding: 10px 10px 25px 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            border-radius: 4px;
            z-index: 5;
        }

        .polaroid img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 2px;
        }

        .p1 { top: 5%; left: 5%; transform: rotate(-8deg); }
        .p2 { top: 10%; right: 5%; transform: rotate(6deg); }
        .p3 { bottom: 5%; left: 8%; transform: rotate(5deg); }

        @media (max-width: 768px) {
            .polaroid { display: none; }
            body { padding: 20px 10px; }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h1>{{ data.title }}</h1>
        <div class="subtitle">{{ data.subtitle }}</div>
        <p class="intro-text">{{ data.intro }}</p>

        {% for card in data.cards %}
        <div class="card-section">
            <h3>{{ card.title }}</h3>
            <p>{{ card.text }}</p>
        </div>
        {% endfor %}
    </div>

</body>
</html>
